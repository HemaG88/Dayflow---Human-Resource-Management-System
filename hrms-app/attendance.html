<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance · Altruistic Deer HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shell.css" />
</head>
<body class="app" data-page="attendance">

<header class="topnav">
  <div class="brand">
    <div class="mark">AD</div>
    <div class="name">Altruistic Deer</div>
  </div>
  <nav>
    <a href="employees.html" data-tab="employees">Employees</a>
    <a href="attendance.html" data-tab="attendance">Attendance</a>
    <a href="timeoff.html" data-tab="timeoff">Time Off</a>
  </nav>
  <div class="spacer"></div>
  <div class="systray">
    <span class="since" id="systraySince"></span>
    <button id="systrayBtn" class="checked-out"><span class="pulse"></span>Check In</button>
  </div>
  <div class="avatar-wrap">
    <button class="avatar-btn" id="avatarBtn" aria-haspopup="true" aria-label="Account menu">
      <span id="avatarDot" class="status-dot absent"></span>
    </button>
    <div class="avatar-menu" id="avatarMenu">
      <div class="who">
        <div class="n" id="menuName">—</div>
        <div class="r" id="menuRole">—</div>
      </div>
      <a href="profile.html">My Profile</a>
      <button class="logout" id="logoutBtn">Log Out</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="page-head"><h1>Attendance</h1></div>
  <div class="empty-state" style="padding:80px 20px;">This screen is next on the build list.</div>
</main>

<script src="js/auth-core.js"></script>
<script src="js/shell.js"></script>
<script>Shell.mount();</script>

</html>
